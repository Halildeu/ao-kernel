name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  # P0-GATE-1 (V5-PR #783, Codex iter-1 absorb): manual dispatch path for
  # re-trigger when an existing tag's first publish attempt failed and the
  # `archive/**` ruleset blocks tag delete/force-update. Default ref = main;
  # operator may pass explicit tag ref via input.
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish (defaults to triggering branch HEAD; pass a tag like v4.1.0 to re-publish that tag)"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for trusted publishing

    steps:
      - uses: actions/checkout@v6
        with:
          # P0-GATE-1 (V5-PR #783): for workflow_dispatch w/ ref input,
          # checkout the operator-specified ref (e.g. v4.1.0 tag) so we
          # publish the intended commit, not the dispatch branch head.
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        # v3.8 H6: 2-try retry guard for transient PyPI/TLS flakes.
        run: pip install build twine || (sleep 5 && pip install build twine)

      - name: Run packaging smoke
        run: python scripts/packaging_smoke.py

      - name: Strip non-distribution files from dist/
        # P0-GATE-1 (V5-PR #783, Codex iter-2 absorb): defense-in-depth.
        # When workflow_dispatch republishes an existing tag (e.g. v4.1.0),
        # the tag's older packaging_smoke.py may still write evidence to
        # `dist/`. Strip everything that is not a wheel or sdist BEFORE
        # twine check + pypa publish so non-distribution files cannot leak
        # into the PyPI upload set even if the tag predates the fix.
        run: |
          find dist -mindepth 1 -maxdepth 1 \
            ! -name "*.whl" ! -name "*.tar.gz" \
            -print -exec rm -rf {} + || true
          ls -la dist/

      - name: Check
        # P0-GATE-1 fix (V5-PR #783): twine check glob MUST be distribution-specific.
        # `dist/*` matched packaging_smoke.py-emitted JSON evidence (ri7-packaging-smoke-evidence.v1.json)
        # → InvalidDistribution "Unknown distribution format". Explicit globs for wheel + sdist only.
        run: twine check dist/*.whl dist/*.tar.gz

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
