name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual rerun reason (e.g. stacked retarget)"
        required: false
        type: string

concurrency:
  # CI-FAST: supersede stale in-progress runs per branch/PR to stop the
  # cancelled-run pileup. Two carve-outs preserve required-check semantics
  # (#764): never cancel `main` (its post-merge run uploads the scorecard-main
  # baseline), and never cancel any `pull_request: edited` event — a
  # non-retarget edit (title/body) is skipped by `event-gate`, so cancelling
  # would shadow-cancel an in-progress real required-check run for the same
  # ref. Retarget edits are excluded too; conservatively cheap.
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !(github.event_name == 'pull_request' && github.event.action == 'edited') }}

jobs:
  event-gate:
    name: event-gate
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      trigger_reason: ${{ steps.decide.outputs.trigger_reason }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          DISPATCH_REASON: ${{ github.event.inputs.reason || '' }}
        run: |
          should_run=false
          trigger_reason=ignored

          case "$EVENT_NAME" in
            push)
              should_run=true
              trigger_reason="push"
              ;;
            workflow_dispatch)
              should_run=true
              trigger_reason="workflow_dispatch:${DISPATCH_REASON:-manual}"
              ;;
            pull_request)
              case "$EVENT_ACTION" in
                opened|reopened|synchronize|ready_for_review)
                  should_run=true
                  trigger_reason="pull_request:$EVENT_ACTION"
                  ;;
                edited)
                  # Retarget (`base` changed) must rerun the full PR gate.
                  if jq -e '.changes.base.ref.from' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
                    should_run=true
                    trigger_reason="pull_request:retargeted"
                  fi
                  ;;
              esac
              ;;
            pull_request_review)
              should_run=true
              trigger_reason="pull_request_review:$EVENT_ACTION"
              ;;
          esac

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "trigger_reason=$trigger_reason" >> "$GITHUB_OUTPUT"
      - name: Explain trigger decision
        run: |
          echo "should_run=${{ steps.decide.outputs.should_run }}"
          echo "trigger_reason=${{ steps.decide.outputs.trigger_reason }}"

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: [event-gate]
    if: needs.event-gate.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        # v3.8 H6: 2-try retry guard for transient PyPI/TLS flakes
        # (one-off `SSL: DECRYPTION_FAILED_OR_BAD_RECORD_MAC` observed
        # on v3.7 release CI; cheap insurance across all installer calls).
        run: |
          python -m pip install uv || (sleep 5 && python -m pip install uv)
          uv pip install --system ruff || (sleep 5 && uv pip install --system ruff)
      - name: Ruff check
        run: ruff check ao_kernel/ tests/

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [event-gate]
    if: needs.event-gate.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        # v3.8 H6 retry guard (see lint job note).
        run: |
          python -m pip install uv || (sleep 5 && python -m pip install uv)
          uv pip install --system -e ".[dev,llm,metrics]" || (sleep 5 && uv pip install --system -e ".[dev,llm,metrics]")
      - name: Run tests
        # CI-FAST (Codex 019e88cc): `-n auto` parallelizes the ~6k-test suite
        # across runner cores (PoC: serial 192s -> -n4 97s with coverage, 85%
        # parity). Coverage instrumentation runs only on the 3.13 leg, whose
        # artifact the `coverage` required-check consumes; 3.11/3.12 are
        # functional-only. `-v` dropped to cut log I/O.
        run: |
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            pytest tests/ --ignore=tests/benchmarks -q -n auto \
              --cov=ao_kernel --cov-branch --cov-report=term-missing \
              --cov-report=xml --cov-fail-under=85
            cp .coverage coverage.data
          else
            pytest tests/ --ignore=tests/benchmarks -q -n auto
          fi
      - name: Upload coverage data (3.13 leg only)
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data
          path: |
            coverage.data
            coverage.xml
          if-no-files-found: error

  coverage:
    # CI-FAST sentinel (Codex 019e88cc): the suite is no longer re-run here.
    # The 3.13 `test` leg produces the coverage data; this job consumes that
    # artifact and enforces the gate under the reserved required-check name
    # `coverage` (kept identical so the ao-release-gate allowlist + the
    # test_ao_release_gate_enforce_job invariant stay valid). Fail-closed: a
    # failed `test` matrix or a missing artifact => failure, never a silent
    # skipped required check.
    name: coverage
    runs-on: ubuntu-latest
    needs: [event-gate, test]
    if: always() && needs.event-gate.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Fail closed if the test matrix did not succeed
        if: needs.test.result != 'success'
        run: |
          echo "::error::coverage gate fail-closed: the test matrix (incl. the 3.13 coverage leg) did not succeed (result=${{ needs.test.result }})"
          exit 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install coverage tool
        run: |
          python -m pip install uv || (sleep 5 && python -m pip install uv)
          uv pip install --system coverage || (sleep 5 && uv pip install --system coverage)
      - name: Download coverage data from the 3.13 test leg
        uses: actions/download-artifact@v8
        with:
          name: coverage-data
      - name: Enforce coverage gate (no suite rerun)
        run: |
          if [ ! -f coverage.data ]; then
            echo "::error::coverage gate fail-closed: coverage.data artifact missing from the 3.13 test leg"
            exit 1
          fi
          cp coverage.data .coverage
          coverage report --fail-under=85
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  packaging-smoke:
    name: packaging-smoke
    runs-on: ubuntu-latest
    needs: [event-gate, test, coverage, lint, typecheck]
    if: needs.event-gate.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tool
        run: |
          python -m pip install uv || (sleep 5 && python -m pip install uv)
          uv pip install --system build || (sleep 5 && uv pip install --system build)
      - name: Build wheel and run packaging smoke
        run: python scripts/packaging_smoke.py

  policy-container-smoke:
    name: policy-container-smoke
    runs-on: ubuntu-latest
    needs: [event-gate]
    if: needs.event-gate.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and health-check policy service container
        run: |
          python scripts/live_adapter_gate_policy_container_smoke.py \
            --image ao-kernel-live-adapter-gate-policy-service:ci \
            --build-timeout-seconds 600 \
            --timeout-seconds 90

  release-gate-container-smoke:
    name: release-gate-container-smoke
    runs-on: ubuntu-latest
    needs: [event-gate]
    if: needs.event-gate.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and health-check ao-release-gate service container
        run: |
          python scripts/ao_release_gate_container_smoke.py \
            --image ao-kernel-ao-release-gate-service:ci \
            --build-timeout-seconds 600 \
            --timeout-seconds 90

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: [event-gate]
    if: needs.event-gate.outputs.should_run == 'true'
    # CNS-006 Q4: after the 131-error cleanup (PR #56), typecheck is a real
    # gate. _internal/* is still under per-module ignore (D13).
    #
    # Install `mcp` extra too: some ignores depend on the mcp SDK being
    # importable (untyped decorators on server.list_tools etc). Without mcp
    # those decorators resolve to Any and the ignores become "unused".
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        # v3.8 H6 retry guard (see lint job note).
        run: |
          python -m pip install uv || (sleep 5 && python -m pip install uv)
          uv pip install --system -e ".[dev,llm,mcp,metrics]" || (sleep 5 && uv pip install --system -e ".[dev,llm,mcp,metrics]")
      - name: Mypy
        run: mypy ao_kernel/

  benchmark-fast:
    name: benchmark-fast
    runs-on: ubuntu-latest
    needs: [event-gate, test]
    if: needs.event-gate.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        # v3.8 H6 retry guard (see lint job note).
        run: |
          python -m pip install uv || (sleep 5 && python -m pip install uv)
          uv pip install --system -e ".[dev,llm,mcp,metrics]" || (sleep 5 && uv pip install --system -e ".[dev,llm,mcp,metrics]")
      - name: Run PR-B7 benchmarks (fast mode) + emit scorecard
        env:
          AO_SCORECARD_OUTPUT: benchmark_scorecard.v1.json
        run: pytest tests/benchmarks/ -q
      - name: Upload head scorecard
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-${{ github.sha }}
          path: benchmark_scorecard.v1.json
          if-no-files-found: warn
      - name: Upload main baseline scorecard
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-main
          path: benchmark_scorecard.v1.json
          if-no-files-found: warn
          overwrite: true

  scorecard:
    name: scorecard
    runs-on: ubuntu-latest
    needs: [event-gate, benchmark-fast]
    if: needs.event-gate.outputs.should_run == 'true' && github.event_name == 'pull_request'
    continue-on-error: true  # Advisory surface — never red-check PRs.
    permissions:
      pull-requests: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        # v3.8 H6 retry guard (see lint job note).
        run: |
          python -m pip install uv || (sleep 5 && python -m pip install uv)
          uv pip install --system -e ".[dev,llm,mcp,metrics]" || (sleep 5 && uv pip install --system -e ".[dev,llm,mcp,metrics]")
      - name: Download head scorecard
        uses: actions/download-artifact@v8
        with:
          name: scorecard-${{ github.sha }}
          path: head/
      # SHA-pinned dawidd6/action-download-artifact@v20
      # (resolved against tag v20 for Node 24 runner compatibility).
      - name: Download main baseline scorecard
        uses: dawidd6/action-download-artifact@8305c0f1062bb0d184d09ef4493ecb9288447732
        with:
          workflow: test.yml
          branch: main
          name: scorecard-main
          path: ./baseline/
          if_no_artifact_found: warn
      - name: Compose scorecard comment
        run: |
          ao-kernel scorecard compare \
            --baseline baseline/benchmark_scorecard.v1.json \
            --head head/benchmark_scorecard.v1.json \
            > scorecard_comment.md
      - name: Post sticky PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ao-kernel scorecard post-comment \
            --pr ${{ github.event.pull_request.number }} \
            --body-file scorecard_comment.md \
            --sentinel '<!-- ao-scorecard -->' || true

  extras-install:
    name: extras-install
    runs-on: ubuntu-latest
    needs: [event-gate]
    if: needs.event-gate.outputs.should_run == 'true'
    continue-on-error: true  # Optional extras smoke — non-blocking
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install and smoke-import each extra
        # v3.8 H6: tiny inline retry helper — retry once on installer flake.
        run: |
          python -m pip install uv || (sleep 5 && python -m pip install uv)
          pip_install() {
            uv pip install --system "$@" || (sleep 5 && uv pip install --system "$@")
          }
          pip_install -e ".[llm]"      && python -c "import tenacity, tiktoken; print('llm OK')"
          pip_install -e ".[otel]"     && python -c "import opentelemetry; print('otel OK')"
          pip_install -e ".[mcp]"      && python -c "import mcp; print('mcp OK')"
          pip_install -e ".[mcp-http]" && python -c "import starlette, uvicorn; print('mcp-http OK')"
          pip_install -e ".[metrics]"  && python -c "import prometheus_client; print('metrics OK')"
          pip_install -e ".[policy-service]" && python -c "import gunicorn, jwt; print('policy-service OK')"

  ao-release-gate:
    # GPP-2D-3c enforce job. Replaces the retired GPP-2D-2c advisory
    # shadow workflow (.github/workflows/ao-release-gate.yml).
    #
    # Trusted-base contract (design §3.2 + §3.6 + Codex C-prime,
    # threads 019e5965 / 019e59f7):
    #   - The decision-core code, schemas, and gpp_status come from
    #     the PR base SHA (`base/` checkout). A PR that edits the gate
    #     cannot thereby change the gate that judges it.
    #   - The PR head is checked out separately into `head/` and is
    #     treated as untrusted input. Only the optional raw reviewer
    #     evidence file (`local-ai-review-evidence.v1.json`) is read
    #     from it. That schema carries no head_sha and is therefore
    #     safe to commit; the head-binding-sensitive gate evidence
    #     (`local-gpp-gate-evidence.v1.json`) is generated AT CI
    #     RUNTIME by base/scripts/local_gpp_gate.py using the live
    #     resolved head SHA, so the binding-equality contract with the
    #     payload always holds.
    #
    # Hard stops:
    # - This slice does NOT mutate branch protection. GPP-2D-5 is what
    #   makes `ao-release-gate` a required status check.
    # - This slice does NOT collect real positive / negative
    #   enforce-mode evidence on live PRs (GPP-2D-4 operator + agent).
    # - No support widening, no production claim, no live adapter.
    name: ao-release-gate
    runs-on: ubuntu-latest
    needs:
      - event-gate
      - lint
      - typecheck
      - test
      - coverage
      - packaging-smoke
      - policy-container-smoke
      - release-gate-container-smoke
    # `always()` + `event-gate.result != 'success'` so a failed /
    # cancelled upstream `needs:` job does NOT silently skip the gate.
    # The fail-closed needs short-circuit below produces a `failure`
    # conclusion instead.
    if: |
      always() && (
        github.event_name == 'pull_request' ||
        github.event_name == 'pull_request_review'
      ) && (
        needs.event-gate.outputs.should_run == 'true' ||
        needs.event-gate.result != 'success'
      )
    timeout-minutes: 10
    permissions:
      contents: read
      # RG-CONCLUSION-SEMANTICS C-prime requires posting the dual
      # check-runs (ao-release-gate-technical + ao-release-gate-review)
      # via the GitHub Checks API. `checks: write` is the minimum scope
      # for POST /repos/{owner}/{repo}/check-runs; reads of upstream
      # check-runs are still satisfied by this elevated scope.
      checks: write
      pull-requests: read
    concurrency:
      group: ao-release-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REPO_FULL: ${{ github.repository }}
      FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}

    steps:
      - name: Refuse non-pull_request context
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "pull_request_review" ]; then
            echo "::error::ao-release-gate only evaluates pull_request or pull_request_review events"
            exit 1
          fi

      - name: Checkout protected base ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1

      - name: Fail closed if any required CI job did not succeed
        if: |
          needs.event-gate.result != 'success' ||
          needs.lint.result != 'success' ||
          needs.typecheck.result != 'success' ||
          needs.test.result != 'success' ||
          needs.coverage.result != 'success' ||
          needs.packaging-smoke.result != 'success' ||
          needs.policy-container-smoke.result != 'success' ||
          needs.release-gate-container-smoke.result != 'success'
        working-directory: base
        run: |
          python scripts/ao_release_gate_synthesize_error_decision.py decision.json \
            --conclusion-mode enforce \
            --reason "ao-release-gate fail-closed: an upstream required CI job (event-gate/lint/typecheck/test/coverage/packaging-smoke/policy-container-smoke/release-gate-container-smoke) did not succeed" \
            --finding-code "ao_release_gate_upstream_required_check_failed"
          exit 1

      - name: Checkout PR head for raw reviewer evidence
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install base-ref ao-kernel
        working-directory: base
        run: |
          python -m pip install uv || (sleep 5 && python -m pip install uv)
          uv pip install --system -e ".[mcp]" || (sleep 5 && uv pip install --system -e ".[mcp]")

      - name: Fetch PR data and check-runs via GitHub API
        working-directory: base
        run: |
          gh pr view "$PR_NUMBER" --repo "$REPO_FULL" --json files > pr-files.json
          gh pr view "$PR_NUMBER" --repo "$REPO_FULL" --json reviews,author > pr-reviews.json
          gh api "repos/$REPO_FULL/commits/$HEAD_SHA/check-runs?per_page=100" > check-runs.json

      - name: Compute branch_up_to_date from base
        id: freshness
        working-directory: base
        run: |
          git fetch --depth=50 origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          if git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "branch_up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch_up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect AO-MA-10l low-risk autonomous smoke request
        id: ao_ma10_smoke
        working-directory: base
        run: |
          REQUESTED="$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("pr-files.json").read_text(encoding="utf-8"))
          files = payload.get("files", []) if isinstance(payload, dict) else []
          prefix = "docs/evidence/ao-ma-10l-autonomous-smoke/"

          def is_smoke_add(entry):
              if not isinstance(entry, dict):
                  return False
              path = entry.get("path")
              if not isinstance(path, str):
                  return False
              parts = path.split("/")
              return (
                  entry.get("changeType") == "ADDED"
                  and "\\" not in path
                  and not path.startswith("/")
                  and path.startswith(prefix)
                  and path.endswith(".md")
                  and "/" not in path[len(prefix):]
                  and all(part not in ("", ".", "..") for part in parts)
              )

          requested = bool(files) and all(is_smoke_add(entry) for entry in files)
          print("true" if requested else "false")
          PY
          )"
          echo "requested=$REQUESTED" >> "$GITHUB_OUTPUT"

      - name: Build API-derived release-gate payload
        working-directory: base
        run: |
          python scripts/ao_release_gate_build_payload.py \
            --repository "$REPO_FULL" \
            --pr-number "$PR_NUMBER" \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF" \
            --head-sha "$HEAD_SHA" \
            --from-fork "$FROM_FORK" \
            --branch-up-to-date "${{ steps.freshness.outputs.branch_up_to_date }}" \
            --gpp-status .claude/plans/gpp_status.v1.json \
            --pr-files-json pr-files.json \
            --check-runs-json check-runs.json \
            --required-check lint \
            --required-check typecheck \
            --required-check "test (3.11)" \
            --required-check "test (3.12)" \
            --required-check "test (3.13)" \
            --required-check coverage \
            --required-check packaging-smoke \
            --required-check policy-container-smoke \
            --required-check release-gate-container-smoke \
            --ao-ma10-autonomous-merge-requested "${{ steps.ao_ma10_smoke.outputs.requested }}" \
            --output payload.json

      - name: Augment release-gate payload with PR review metadata
        working-directory: base
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload_path = Path("payload.json")
          payload = json.loads(payload_path.read_text(encoding="utf-8"))
          review_payload = json.loads(Path("pr-reviews.json").read_text(encoding="utf-8"))

          def normalized_string(value):
              return value.strip() if isinstance(value, str) and value.strip() else None

          author_payload = review_payload.get("author")
          pr_author = None
          if isinstance(author_payload, dict):
              pr_author = normalized_string(author_payload.get("login"))

          reviews = []
          raw_reviews = review_payload.get("reviews")
          if isinstance(raw_reviews, list):
              for item in raw_reviews:
                  if not isinstance(item, dict):
                      continue
                  reviewer = item.get("author")
                  commit = item.get("commit")
                  review = {
                      "author": normalized_string(reviewer.get("login")) if isinstance(reviewer, dict) else None,
                      "state": normalized_string(item.get("state")),
                      "commit_oid": normalized_string(commit.get("oid")) if isinstance(commit, dict) else None,
                  }
                  if any(value is not None for value in review.values()):
                      reviews.append(review)

          pull_request = payload.setdefault("pull_request", {})
          if isinstance(pull_request, dict) and pr_author is not None:
              pull_request["author"] = {"login": pr_author}
          payload["pr_author"] = pr_author
          payload["human_reviews"] = reviews
          payload["path_sensitive_human_review_enabled"] = True
          payload_path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Locate optional raw reviewer evidence on PR head
        id: reviewer
        working-directory: base
        run: |
          # The reviewer schema (local-ai-review-evidence.schema.v1.json)
          # carries no head_sha, so the file is safe to commit on the PR
          # head: it does not create the head_sha self-reference fixed
          # point that a head-bound `local-gpp-gate-evidence.v1.json`
          # would. However, the root evidence file must also be part of
          # the current PR diff. Otherwise a PR inherits stale evidence
          # from the base branch and the gate may evaluate a previous PR's
          # review as if it belonged to this one.
          REVIEW_CHANGED="$(python - <<'PY'
          import json
          from pathlib import Path

          path = Path("pr-files.json")
          if not path.exists():
              print("false")
              raise SystemExit(0)
          payload = json.loads(path.read_text(encoding="utf-8"))
          files = payload.get("files", []) if isinstance(payload, dict) else []
          paths = {entry.get("path") for entry in files if isinstance(entry, dict)}
          print("true" if "local-ai-review-evidence.v1.json" in paths else "false")
          PY
          )"
          if [ "$REVIEW_CHANGED" = "true" ] && [ -f ../head/local-ai-review-evidence.v1.json ]; then
            echo "path=head/local-ai-review-evidence.v1.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve reviewed work package from reviewer evidence
        # GOV-1 dynamic work_package binding (Codex thread 019e5bc5
        # Option B-prime). The workflow previously hardcoded the GPP-2
        # slice identifier as a literal CLI argument, which failed the
        # local_gpp_gate scope check for any slice whose reviewer
        # evidence declared a different work package (e.g. GOV-1,
        # future GPP-3 / GPP-4 / ...).
        # This step reads the reviewer-declared work_package, validates
        # it against a strict format regex (uppercase + dash-separated
        # identifier; no shell metacharacters), and writes it back into
        # the runtime payload.json so the decision-core's
        # review_evidence.work_package == payload.reviewed_slice
        # binding holds for any reviewed slice. Base gpp_status still
        # supplies guard flags, issue consistency, and release
        # governance boundaries — only the reviewed-slice context is
        # made dynamic. Release authority stays with the ao-release-gate
        # required check + branch ruleset + non-author approval (CC-5).
        id: reviewed_wp
        if: ${{ steps.reviewer.outputs.path != '' }}
        working-directory: base
        env:
          REVIEW_EVIDENCE_PATH: ../${{ steps.reviewer.outputs.path }}
        run: |
          REVIEW_WORK_PACKAGE="$(python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["REVIEW_EVIDENCE_PATH"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          wp = payload.get("work_package")
          if not isinstance(wp, str) or not wp.strip():
              raise SystemExit("reviewer evidence missing work_package")
          wp = wp.strip()
          if not re.fullmatch(r"[A-Z][A-Z0-9]*(?:-[A-Za-z0-9][A-Za-z0-9._]*)*", wp):
              raise SystemExit("reviewer evidence work_package has invalid format")
          print(wp)
          PY
          )"
          echo "work_package=$REVIEW_WORK_PACKAGE" >> "$GITHUB_OUTPUT"
          export REVIEW_WORK_PACKAGE
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload_path = Path("payload.json")
          payload = json.loads(payload_path.read_text(encoding="utf-8"))
          payload["reviewed_slice"] = os.environ["REVIEW_WORK_PACKAGE"]
          payload_path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Generate local-gpp-gate evidence at runtime from reviewer evidence
        # Trusted-base step (Codex C-prime, thread 019e59f7):
        # base/scripts/local_gpp_gate.py runs against the untrusted PR
        # head reviewer evidence and the actual git diff. The output
        # `local-gpp-gate-evidence.v1.json` carries the context_binding
        # (head_sha, diff_digest, ...) computed at RUNTIME so the
        # decision-core's binding-equality contract with the payload
        # always holds — a property a committed head-bound gate
        # evidence file cannot offer.
        if: ${{ steps.reviewer.outputs.path != '' }}
        working-directory: base
        env:
          REVIEW_WORK_PACKAGE: ${{ steps.reviewed_wp.outputs.work_package }}
        run: |
          # The base checkout was created with fetch-depth=1 (only the
          # base SHA). To diff base...head, head_sha must be in base's
          # git db. fetch-depth=50 covers typical PR sizes.
          git fetch --depth=50 origin "$HEAD_SHA" 2>/dev/null || true
          git fetch --depth=50 origin "$BASE_SHA" 2>/dev/null || true
          #
          # GPP-2D-3c trusted-base ref-binding (Codex iter-3 absorb):
          # The base checkout is a detached HEAD at $BASE_SHA. Branch
          # names like `main` and `codex/...` are NOT guaranteed to
          # exist as local refs in this clone. The legacy alias path
          # below resolves them through `git diff <base_ref>...<head_ref>`
          # and `git rev-parse <head_ref>`, which require the names to
          # be valid refs. So we explicitly bind the API-reported branch
          # labels to the API-reported runtime SHAs here, using
          # `git update-ref` against namespaced refs the script (and
          # only the script) walks via the legacy alias. This makes
          # `context_binding.head_sha` always equal $HEAD_SHA and the
          # diff always span $BASE_SHA...$HEAD_SHA, regardless of
          # whether the underlying branches still exist or have since
          # advanced on the remote.
          #
          # The ref labels are first validated against a strict
          # `git check-ref-format` to reject anything that is not a
          # safe Git ref (refname-invalid values such as path
          # traversal sequences or control bytes); a hostile label
          # cannot inject CLI options into the update-ref command or
          # anywhere downstream because the fully-qualified
          # `refs/heads/$REF` form is what reaches local_gpp_gate.py,
          # so a leading dash on $REF becomes `refs/heads/-...` and
          # is no longer at argv position 0.
          if ! git check-ref-format "refs/heads/$BASE_REF"; then
            echo "ao-release-gate: unsafe BASE_REF '$BASE_REF'; rejecting" >&2
            exit 1
          fi
          if ! git check-ref-format "refs/heads/$HEAD_REF"; then
            echo "ao-release-gate: unsafe HEAD_REF '$HEAD_REF'; rejecting" >&2
            exit 1
          fi
          git update-ref "refs/heads/$BASE_REF" "$BASE_SHA"
          git update-ref "refs/heads/$HEAD_REF" "$HEAD_SHA"
          # local_gpp_gate.py exits 1 when its own decision is
          # fail_closed; `|| true` keeps the workflow going so the
          # downstream decision script (the canonical ao-release-gate
          # authority) reads the produced artifact and applies
          # --fail-on-deny there. The audit artifact still records the
          # local-gpp-gate body for debugging.
          #
          # GPP-2D-3c bootstrap-safe contract: this workflow checks out
          # the script from the PR base SHA (trusted-base discipline).
          # That base copy of local_gpp_gate.py predates the dual-ref
          # --review-base-ref / --review-head-ref / --diff-base-ref /
          # --diff-head-ref split, so passing those flags here would
          # produce an "unrecognized arguments" parse error on the base
          # copy and fail the gate open. Instead we pass the FULLY
          # QUALIFIED local refs we created above (refs/heads/$BASE_REF
          # / refs/heads/$HEAD_REF) through the legacy --base-ref /
          # --head-ref aliases. The base copy accepts those refs
          # directly:
          #   * scope check string-equality matches the committed reviewer
          #     evidence's scope_reviewed.base_ref / head_ref, which
          #     record the same fully-qualified refs/heads/* form (never
          #     SHAs, so the head_sha self-reference fixed point stays
          #     closed);
          #   * `git diff refs/heads/<base>...refs/heads/<head>` resolves
          #     unambiguously to the local branch refs we just bound to
          #     $BASE_SHA / $HEAD_SHA, so the actual diff always spans
          #     the two real PR commits;
          #   * `git rev-parse refs/heads/<head>` pins context_binding
          #     .head_sha to $HEAD_SHA. Passing the unqualified label
          #     instead would let Git fall back through unqualified
          #     revision lookup to a same-named tag or other object,
          #     breaking the binding contract — fully-qualified refs
          #     close that drift (Codex iter-4 absorb).
          # Once dual-ref support lands on main, a follow-up slice can
          # upgrade this invocation to --review-* / --diff-*; the
          # head-side scripts/local_gpp_gate.py already exposes the
          # split, and tests/test_local_gpp_gate.py pins it end-to-end.
          python scripts/local_gpp_gate.py \
            --review-evidence "../${{ steps.reviewer.outputs.path }}" \
            --output local-gpp-gate-evidence.v1.json \
            --repo "$REPO_FULL" \
            --work-package "$REVIEW_WORK_PACKAGE" \
            --base-ref "refs/heads/$BASE_REF" \
            --head-ref "refs/heads/$HEAD_REF" \
            --repo-root . \
            > local-gpp-gate.stdout.log 2>&1 || true

      - name: Locate optional high-risk raw reviewer evidence on PR head
        id: high_risk_reviewers
        working-directory: base
        run: |
          HIGH_RISK_CHANGED="$(python - <<'PY'
          import json
          from pathlib import Path

          from ao_kernel.ao_release_gate import _high_risk_paths

          payload = json.loads(Path("payload.json").read_text(encoding="utf-8"))
          changed_paths = payload.get("changed_paths", [])
          if not isinstance(changed_paths, list):
              changed_paths = []
          changed_paths = [path for path in changed_paths if isinstance(path, str)]
          print("true" if _high_risk_paths(changed_paths) else "false")
          PY
          )"
          if [ "$HIGH_RISK_CHANGED" != "true" ]; then
            echo "openai_path=" >> "$GITHUB_OUTPUT"
            echo "anthropic_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OPENAI_PATH="head/ao-ma-10-high-risk-reviews/openai.local-ai-review-evidence.v1.json"
          ANTHROPIC_PATH="head/ao-ma-10-high-risk-reviews/anthropic.local-ai-review-evidence.v1.json"
          if [ -f "../$OPENAI_PATH" ] && [ -f "../$ANTHROPIC_PATH" ]; then
            if [ ! -f ../head/local-ai-review-evidence.v1.json ]; then
              echo "::error::high-risk supersession raw reviews require root local-ai-review-evidence.v1.json for reviewed work-package binding"
              exit 1
            fi
            echo "openai_path=$OPENAI_PATH" >> "$GITHUB_OUTPUT"
            echo "anthropic_path=$ANTHROPIC_PATH" >> "$GITHUB_OUTPUT"
          elif [ -f "../$OPENAI_PATH" ] || [ -f "../$ANTHROPIC_PATH" ]; then
            echo "::error::high-risk supersession evidence requires both OpenAI and Anthropic raw reviewer files"
            exit 1
          else
            echo "openai_path=" >> "$GITHUB_OUTPUT"
            echo "anthropic_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate high-risk supersession evidence at runtime from raw reviewer evidence
        # AO-MA-10j: raw PR-head review files carry no head_sha. The
        # trusted-base workflow binds them to the live PR head/diff at
        # runtime, then passes only the generated head-bound artifact to
        # the decision core. This avoids committing a head_sha-bearing
        # supersession artifact and re-opening the self-reference problem.
        #
        # AO-MA-10 introducer-PR runtime fix (Codex thread 019e6ffc plan-time
        # AGREE absorb): the script classifies each raw reviewer evidence
        # file's appearance in this PR's diff into binding_mode = {added,
        # modified, unchanged}. Strict current-PR scope binding is enforced
        # for `added` and `modified`; `unchanged` is the state-at-landing
        # pin (introducer PR already validated; immutable properties are
        # enforced perpetually). Raw paths are matched against a fixed
        # allowlist by suffix-parts; provider field is path-bound to
        # prevent audit-provenance shuffling. Fail-closed for `deleted`
        # (governance break; the pair-presence check above should have
        # caught this).
        if: ${{ steps.high_risk_reviewers.outputs.openai_path != '' }}
        working-directory: base
        env:
          REVIEW_WORK_PACKAGE: ${{ steps.reviewed_wp.outputs.work_package }}
        run: |
          # Fetch failures are not ignored semantically: the runtime
          # builder below must resolve $BASE_SHA...$HEAD_SHA and will
          # fail closed if either object is unavailable in this checkout.
          git fetch --depth=50 origin "$HEAD_SHA" 2>/dev/null || true
          git fetch --depth=50 origin "$BASE_SHA" 2>/dev/null || true
          python scripts/ao_ma10_high_risk_supersession_evidence.py \
            --repository "$REPO_FULL" \
            --review-work-package "$REVIEW_WORK_PACKAGE" \
            --review-base-ref "refs/heads/$BASE_REF" \
            --review-head-ref "refs/heads/$HEAD_REF" \
            --diff-base-ref "$BASE_SHA" \
            --diff-head-ref "$HEAD_SHA" \
            --repo-root . \
            --review-evidence "../${{ steps.high_risk_reviewers.outputs.openai_path }}" \
            --review-evidence "../${{ steps.high_risk_reviewers.outputs.anthropic_path }}" \
            --output high-risk-supersession-evidence.v1.json

      - name: Evaluate ao-release-gate decision (enforce, bootstrap-safe C-prime wrapper)
        # RG-CONCLUSION-SEMANTICS C-prime contract (Codex thread 019e65c3
        # iter-2 + iter-3 absorb). The decision-core code is checked out
        # from the PR base SHA (`base/scripts/`), so a freshly opened
        # RG-1 migration PR runs against a base that has not yet
        # received the new ``--wrapper-exit-code`` /
        # ``--emit-multi-check-runs`` flags. To keep this PR self-runnable
        # without rewriting branch protection, the step is bootstrap-safe:
        # it probes ``--help`` for the new flags and falls back to the
        # legacy ``--fail-on-deny`` invocation when the base script does
        # not yet support them. After RG-1 merges, every subsequent PR
        # base will have the new flags and the C-prime branch is taken.
        working-directory: base
        run: |
          mkdir -p check-runs
          if python scripts/ao_release_gate_decision.py --help 2>/dev/null | grep -q -- '--wrapper-exit-code'; then
            EXIT_MODE="--wrapper-exit-code"
            EMIT_FLAGS="--emit-multi-check-runs check-runs"
          else
            echo "::warning::base script predates RG-CONCLUSION-SEMANTICS C-prime; falling back to --fail-on-deny"
            EXIT_MODE="--fail-on-deny"
            EMIT_FLAGS=""
          fi
          HIGH_RISK_FLAGS=()
          if [ -f high-risk-supersession-evidence.v1.json ]; then
            HIGH_RISK_FLAGS=(--high-risk-supersession-evidence high-risk-supersession-evidence.v1.json)
          fi
          if [ -f local-gpp-gate-evidence.v1.json ]; then
            # shellcheck disable=SC2086
            python scripts/ao_release_gate_decision.py \
              --payload payload.json \
              --gpp-status .claude/plans/gpp_status.v1.json \
              --review-evidence local-gpp-gate-evidence.v1.json \
              "${HIGH_RISK_FLAGS[@]}" \
              --decision-path decision.json \
              --output text \
              --conclusion-mode enforce \
              $EMIT_FLAGS \
              $EXIT_MODE
          else
            # shellcheck disable=SC2086
            python scripts/ao_release_gate_decision.py \
              --payload payload.json \
              --gpp-status .claude/plans/gpp_status.v1.json \
              "${HIGH_RISK_FLAGS[@]}" \
              --decision-path decision.json \
              --output text \
              --conclusion-mode enforce \
              $EMIT_FLAGS \
              $EXIT_MODE
          fi

      - name: Publish dual check-runs via Checks API (bootstrap-safe)
        # RG-CONCLUSION-SEMANTICS C-prime dual publish. The publish
        # script lives in ``base/scripts/`` (trusted-base contract). On
        # an RG-1 bootstrap PR whose base predates the script, this step
        # logs a warning and skips so the workflow does not double-fail
        # alongside the legacy decision step.
        # ``always()`` so the check-runs surface even when the decision
        # step exited non-zero on a real violation.
        if: always()
        working-directory: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f scripts/ao_release_gate_publish_check_runs.py ]; then
            echo "::warning::base lacks scripts/ao_release_gate_publish_check_runs.py; dual check-run publish skipped (RG-1 bootstrap path)"
            exit 0
          fi
          python scripts/ao_release_gate_publish_check_runs.py \
            --dir check-runs \
            --repo "$REPO_FULL" \
            --head-sha "$HEAD_SHA"

      - name: Synthesize error_fail_closed audit artifact if pre-decision step crashed
        if: always()
        working-directory: base
        run: |
          if [ ! -f decision.json ]; then
            python scripts/ao_release_gate_synthesize_error_decision.py decision.json \
              --conclusion-mode enforce \
              --reason "ao-release-gate could not produce a decision; a pre-decision step failed before the decision core ran." \
              --finding-code "ao_release_gate_pre_decision_step_failed"
          fi

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ao-release-gate-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            base/payload.json
            base/decision.json
            base/local-gpp-gate-evidence.v1.json
            base/local-gpp-gate.stdout.log
            base/high-risk-supersession-evidence.v1.json
          if-no-files-found: warn
