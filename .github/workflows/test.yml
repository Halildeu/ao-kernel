name: Test

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual rerun reason (e.g. stacked retarget)"
        required: false
        type: string

jobs:
  event-gate:
    name: event-gate
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      trigger_reason: ${{ steps.decide.outputs.trigger_reason }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          DISPATCH_REASON: ${{ github.event.inputs.reason || '' }}
        run: |
          should_run=false
          trigger_reason=ignored

          case "$EVENT_NAME" in
            push)
              should_run=true
              trigger_reason="push"
              ;;
            workflow_dispatch)
              should_run=true
              trigger_reason="workflow_dispatch:${DISPATCH_REASON:-manual}"
              ;;
            pull_request)
              case "$EVENT_ACTION" in
                opened|reopened|synchronize|ready_for_review)
                  should_run=true
                  trigger_reason="pull_request:$EVENT_ACTION"
                  ;;
                edited)
                  # Retarget (`base` changed) must rerun the full PR gate.
                  if jq -e '.changes.base.ref.from' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
                    should_run=true
                    trigger_reason="pull_request:retargeted"
                  fi
                  ;;
              esac
              ;;
          esac

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "trigger_reason=$trigger_reason" >> "$GITHUB_OUTPUT"
      - name: Explain trigger decision
        run: |
          echo "should_run=${{ steps.decide.outputs.should_run }}"
          echo "trigger_reason=${{ steps.decide.outputs.trigger_reason }}"

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: [event-gate]
    if: needs.event-gate.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff
        # v3.8 H6: 2-try retry guard for transient PyPI/TLS flakes
        # (one-off `SSL: DECRYPTION_FAILED_OR_BAD_RECORD_MAC` observed
        # on v3.7 release CI; cheap insurance across all pip installs).
        run: pip install ruff || (sleep 5 && pip install ruff)
      - name: Ruff check
        run: ruff check ao_kernel/ tests/

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [event-gate]
    if: needs.event-gate.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # v3.8 H6 retry guard (see lint job note).
        run: pip install -e ".[dev,llm,metrics]" || (sleep 5 && pip install -e ".[dev,llm,metrics]")
      - name: Run tests
        run: pytest tests/ --ignore=tests/benchmarks -v --cov=ao_kernel --cov-branch --cov-report=term-missing

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [event-gate]
    if: needs.event-gate.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        # v3.8 H6 retry guard (see lint job note).
        run: pip install -e ".[dev,llm,metrics]" || (sleep 5 && pip install -e ".[dev,llm,metrics]")
      - name: Run tests with coverage gate
        run: |
          pytest tests/ --ignore=tests/benchmarks --cov=ao_kernel --cov-branch --cov-report=xml --cov-report=term-missing
          coverage report --fail-under=85
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  packaging-smoke:
    name: packaging-smoke
    runs-on: ubuntu-latest
    needs: [event-gate, test, coverage, lint, typecheck]
    if: needs.event-gate.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build tool
        run: pip install build || (sleep 5 && pip install build)
      - name: Build wheel and run packaging smoke
        run: python scripts/packaging_smoke.py

  policy-container-smoke:
    name: policy-container-smoke
    runs-on: ubuntu-latest
    needs: [event-gate]
    if: needs.event-gate.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build and health-check policy service container
        run: |
          python scripts/live_adapter_gate_policy_container_smoke.py \
            --image ao-kernel-live-adapter-gate-policy-service:ci \
            --build-timeout-seconds 600 \
            --timeout-seconds 90

  release-gate-container-smoke:
    name: release-gate-container-smoke
    runs-on: ubuntu-latest
    needs: [event-gate]
    if: needs.event-gate.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build and health-check ao-release-gate service container
        run: |
          python scripts/ao_release_gate_container_smoke.py \
            --image ao-kernel-ao-release-gate-service:ci \
            --build-timeout-seconds 600 \
            --timeout-seconds 90

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: [event-gate]
    if: needs.event-gate.outputs.should_run == 'true'
    # CNS-006 Q4: after the 131-error cleanup (PR #56), typecheck is a real
    # gate. _internal/* is still under per-module ignore (D13).
    #
    # Install `mcp` extra too: some ignores depend on the mcp SDK being
    # importable (untyped decorators on server.list_tools etc). Without mcp
    # those decorators resolve to Any and the ignores become "unused".
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        # v3.8 H6 retry guard (see lint job note).
        run: pip install -e ".[dev,llm,mcp,metrics]" || (sleep 5 && pip install -e ".[dev,llm,mcp,metrics]")
      - name: Mypy
        run: mypy ao_kernel/

  benchmark-fast:
    name: benchmark-fast
    runs-on: ubuntu-latest
    needs: [event-gate, test]
    if: needs.event-gate.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        # v3.8 H6 retry guard (see lint job note).
        run: pip install -e ".[dev,llm,mcp,metrics]" || (sleep 5 && pip install -e ".[dev,llm,mcp,metrics]")
      - name: Run PR-B7 benchmarks (fast mode) + emit scorecard
        env:
          AO_SCORECARD_OUTPUT: benchmark_scorecard.v1.json
        run: pytest tests/benchmarks/ -q
      - name: Upload head scorecard
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-${{ github.sha }}
          path: benchmark_scorecard.v1.json
          if-no-files-found: warn
      - name: Upload main baseline scorecard
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-main
          path: benchmark_scorecard.v1.json
          if-no-files-found: warn
          overwrite: true

  scorecard:
    name: scorecard
    runs-on: ubuntu-latest
    needs: [event-gate, benchmark-fast]
    if: needs.event-gate.outputs.should_run == 'true' && github.event_name == 'pull_request'
    continue-on-error: true  # Advisory surface — never red-check PRs.
    permissions:
      pull-requests: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        # v3.8 H6 retry guard (see lint job note).
        run: pip install -e ".[dev,llm,mcp,metrics]" || (sleep 5 && pip install -e ".[dev,llm,mcp,metrics]")
      - name: Download head scorecard
        uses: actions/download-artifact@v8
        with:
          name: scorecard-${{ github.sha }}
          path: head/
      # SHA-pinned dawidd6/action-download-artifact@v20
      # (resolved against tag v20 for Node 24 runner compatibility).
      - name: Download main baseline scorecard
        uses: dawidd6/action-download-artifact@8305c0f1062bb0d184d09ef4493ecb9288447732
        with:
          workflow: test.yml
          branch: main
          name: scorecard-main
          path: ./baseline/
          if_no_artifact_found: warn
      - name: Compose scorecard comment
        run: |
          ao-kernel scorecard compare \
            --baseline baseline/benchmark_scorecard.v1.json \
            --head head/benchmark_scorecard.v1.json \
            > scorecard_comment.md
      - name: Post sticky PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ao-kernel scorecard post-comment \
            --pr ${{ github.event.pull_request.number }} \
            --body-file scorecard_comment.md \
            --sentinel '<!-- ao-scorecard -->' || true

  extras-install:
    name: extras-install
    runs-on: ubuntu-latest
    needs: [event-gate]
    if: needs.event-gate.outputs.should_run == 'true'
    continue-on-error: true  # Optional extras smoke — non-blocking
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install and smoke-import each extra
        # v3.8 H6: tiny inline retry helper — retry once on pip flake.
        run: |
          pip_install() {
            pip install "$@" || (sleep 5 && pip install "$@")
          }
          pip_install -e ".[llm]"      && python -c "import tenacity, tiktoken; print('llm OK')"
          pip_install -e ".[otel]"     && python -c "import opentelemetry; print('otel OK')"
          pip_install -e ".[mcp]"      && python -c "import mcp; print('mcp OK')"
          pip_install -e ".[mcp-http]" && python -c "import starlette, uvicorn; print('mcp-http OK')"
          pip_install -e ".[metrics]"  && python -c "import prometheus_client; print('metrics OK')"
          pip_install -e ".[policy-service]" && python -c "import gunicorn, jwt; print('policy-service OK')"

  ao-release-gate:
    # GPP-2D-3b enforce job. Replaces the retired GPP-2D-2c advisory
    # shadow workflow (.github/workflows/ao-release-gate.yml). The
    # bootstrap-safe pre-requisite for the new CLI args
    # (--conclusion-mode, --required-check, --reason, --finding-code)
    # landed in PR-A (#596 -> b2d8485).
    #
    # The job lives inside test.yml so it can `needs:` the rest of the
    # CI matrix and evaluate only after the required upstream jobs
    # have settled (design doc §3.5; GitHub Actions does not support
    # cross-workflow `needs:`).
    #
    # Hard stops:
    # - This slice does NOT mutate branch protection. The GPP-2D-5
    #   operator action is what makes `ao-release-gate` a required
    #   status check.
    # - This slice does NOT collect real positive / negative
    #   enforce-mode evidence on live PRs (GPP-2D-4, operator + agent
    #   verification).
    # - No support widening, no production platform claim, no live
    #   adapter execution. GPP-2 stays blocked.
    name: ao-release-gate
    runs-on: ubuntu-latest
    needs:
      - event-gate
      - lint
      - typecheck
      - test
      - coverage
      - packaging-smoke
      - policy-container-smoke
      - release-gate-container-smoke
    # `always()` so a failed upstream `needs:` job does NOT silently
    # skip the gate — the fail-closed needs short-circuit below
    # produces a `failure` conclusion instead.
    if: always() && needs.event-gate.outputs.should_run == 'true' && github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
    concurrency:
      group: ao-release-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REPO_FULL: ${{ github.repository }}
      FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}

    steps:
      - name: Refuse non-pull_request context
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Defense in depth — the job `if:` already restricts this to
          # pull_request. pull_request_target is the unsafe variant the
          # trusted-base design forbids.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "::error::ao-release-gate only evaluates pull_request events"
            exit 1
          fi

      - name: Checkout protected base ref
        uses: actions/checkout@v6
        with:
          # Trusted-base gate (design §3.2): the decision-core code,
          # bundled schemas, and gpp_status.v1.json come from the PR
          # base ref, never the PR head. A PR that edits the gate
          # itself cannot thereby change the gate that judges it.
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1

      - name: Fail closed if any required CI job did not succeed
        # The job runs under `if: always()` so a red matrix does not
        # make the gate silently skipped. This step inspects every
        # `needs.*.result` for the required dependency graph and, if
        # any one is not `success`, writes a fail-closed audit artifact
        # with `--conclusion-mode enforce` and exits 1 so the gate
        # posts `failure` (not `skipped`). event-gate is included so
        # an event-gate failure also fail-closes the gate rather than
        # leaving it skipped via the job `if:`.
        if: |
          needs.event-gate.result != 'success' ||
          needs.lint.result != 'success' ||
          needs.typecheck.result != 'success' ||
          needs.test.result != 'success' ||
          needs.coverage.result != 'success' ||
          needs.packaging-smoke.result != 'success' ||
          needs.policy-container-smoke.result != 'success' ||
          needs.release-gate-container-smoke.result != 'success'
        working-directory: base
        run: |
          python scripts/ao_release_gate_synthesize_error_decision.py decision.json \
            --conclusion-mode enforce \
            --reason "ao-release-gate fail-closed: an upstream required CI job (event-gate/lint/typecheck/test/coverage/packaging-smoke/policy-container-smoke/release-gate-container-smoke) did not succeed" \
            --finding-code "ao_release_gate_upstream_required_check_failed"
          # Fail the job so branch protection sees `failure`, not `skipped`.
          exit 1

      - name: Checkout PR head for optional review-evidence file
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 1
          # The PR head is untrusted; we only read the optional review
          # evidence file from it. The decision core validates it hard
          # against the bundled schema and acceptance profile.

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install base-ref ao-kernel
        working-directory: base
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]"

      - name: Fetch PR data and check-runs via GitHub API
        working-directory: base
        run: |
          # Fetch PR files (changed_paths) and the head SHA's check-runs.
          # per_page=100 single page avoids the --paginate object-concat
          # pitfall. The builder excludes self-name and de-dupes by
          # name; --required-check below restricts the gate to the
          # explicit allowlist.
          gh pr view "$PR_NUMBER" --repo "$REPO_FULL" --json files > pr-files.json
          gh api "repos/$REPO_FULL/commits/$HEAD_SHA/check-runs?per_page=100" > check-runs.json

      - name: Compute branch_up_to_date from base
        id: freshness
        working-directory: base
        run: |
          git fetch --depth=50 origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          if git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "branch_up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch_up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build API-derived release-gate payload
        working-directory: base
        run: |
          # --required-check allowlist matches the job's `needs:` graph.
          # Advisory / non-blocking jobs (extras-install, benchmark-fast,
          # scorecard) cannot block the gate via their pending or
          # failing state. Allowlist names the API does not return are
          # surfaced as `status: "missing"` placeholders so the decision
          # core's required-checks-are-green check fails closed.
          python scripts/ao_release_gate_build_payload.py \
            --repository "$REPO_FULL" \
            --pr-number "$PR_NUMBER" \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF" \
            --head-sha "$HEAD_SHA" \
            --from-fork "$FROM_FORK" \
            --branch-up-to-date "${{ steps.freshness.outputs.branch_up_to_date }}" \
            --gpp-status .claude/plans/gpp_status.v1.json \
            --pr-files-json pr-files.json \
            --check-runs-json check-runs.json \
            --required-check lint \
            --required-check typecheck \
            --required-check "test (3.11)" \
            --required-check "test (3.12)" \
            --required-check "test (3.13)" \
            --required-check coverage \
            --required-check packaging-smoke \
            --required-check policy-container-smoke \
            --required-check release-gate-container-smoke \
            --output payload.json

      - name: Locate optional review evidence on PR head
        id: evidence
        run: |
          if [ -f head/local-gpp-gate-evidence.v1.json ]; then
            echo "path=head/local-gpp-gate-evidence.v1.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate ao-release-gate decision (enforce)
        # GPP-2D-3b enforce contract:
        #   --conclusion-mode enforce maps deny/error to
        #     github_check_run.conclusion=failure in the artifact body.
        #   --fail-on-deny exits the script with code 1 on any
        #     deny_* / error_fail_closed. NO continue-on-error.
        # Branch protection cutover is GPP-2D-5 (operator action).
        working-directory: base
        run: |
          if [ -n "${{ steps.evidence.outputs.path }}" ]; then
            python scripts/ao_release_gate_decision.py \
              --payload payload.json \
              --gpp-status .claude/plans/gpp_status.v1.json \
              --review-evidence "../${{ steps.evidence.outputs.path }}" \
              --decision-path decision.json \
              --output text \
              --conclusion-mode enforce \
              --fail-on-deny
          else
            python scripts/ao_release_gate_decision.py \
              --payload payload.json \
              --gpp-status .claude/plans/gpp_status.v1.json \
              --decision-path decision.json \
              --output text \
              --conclusion-mode enforce \
              --fail-on-deny
          fi

      - name: Synthesize error_fail_closed audit artifact if pre-decision step crashed
        # Audit safety net. The decision script writes decision.json
        # before exiting, so a deny/error decision still leaves an
        # auditable record. This step only fires when none of the
        # earlier steps produced decision.json. The synthesizer writes
        # a fail-CLOSED record with --conclusion-mode enforce; it does
        # NOT alter the job exit code, so the prior step's failure
        # already marks the job failed.
        if: always()
        working-directory: base
        run: |
          if [ ! -f decision.json ]; then
            python scripts/ao_release_gate_synthesize_error_decision.py decision.json \
              --conclusion-mode enforce \
              --reason "ao-release-gate could not produce a decision; a pre-decision step failed before the decision core ran." \
              --finding-code "ao_release_gate_pre_decision_step_failed"
          fi

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ao-release-gate-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            base/payload.json
            base/decision.json
          if-no-files-found: warn
