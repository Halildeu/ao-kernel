apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ao-kernel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ao-kernel.labels" . | nindent 4 }}
spec:
  # HARD RULE: replicas MUST be >= 1 (scale-to-zero forbidden).
  # values.schema.json enforces minimum:1 on .Values.replicaCount.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ao-kernel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ao-kernel.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ao-kernel.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: healthz
              containerPort: {{ .Values.service.healthzPort }}
              protocol: TCP
            - name: readyz
              containerPort: {{ .Values.service.readyzPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ao-kernel.fullname" . }}
          env:
            {{- range .Values.env.plain }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- range .Values.env.secretRefs }}
            # Secret referenced via secretKeyRef ONLY (chart does NOT create the Secret;
            # operator pre-provisions via Kubernetes Secret out-of-band).
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            # PostgreSQL backend (E-4-3): operator-owned EXTERNAL database.
            # Connection coordinates are non-secret plain env; the application
            # role username/password are resolved via secretKeyRef ONLY from
            # the operator-provisioned Secret (chart does NOT create it).
            - name: AO_KERNEL_DB_HOST
              value: {{ .Values.postgresql.host | quote }}
            - name: AO_KERNEL_DB_PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: AO_KERNEL_DB_NAME
              value: {{ .Values.postgresql.dbname | quote }}
            - name: AO_KERNEL_DB_SSLMODE
              value: {{ .Values.postgresql.sslmode | quote }}
            - name: AO_KERNEL_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.secretName }}
                  key: {{ .Values.postgresql.usernameKey }}
            - name: AO_KERNEL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.secretName }}
                  key: {{ .Values.postgresql.passwordKey }}
            {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: readyz
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.monitoring.otelSidecar.enabled }}
        # Optional OpenTelemetry Collector sidecar SKELETON (E-4-4; Codex
        # review absorb — claim narrowed). The chart provides ONLY: the
        # container slot, a hardened securityContext, a pinned image, and the
        # OTLP endpoint env. The operator MUST still: (1) supply the collector
        # config (e.g. mount a ConfigMap with receivers/exporters and pass
        # `--config`), and (2) wire the MAIN container's OTLP exporter to
        # localhost:4317. The chart does NOT auto-wire the main container and
        # does NOT ship a collector config. No secret embedded.
        - name: otel-collector
          image: {{ .Values.monitoring.otelSidecar.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.monitoring.otelSidecar.otlpEndpoint | quote }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
