# ao-kernel Helm values — operator-installable beta skeleton (V5 Epic 4 E-4-1)
#
# CRITICAL INVARIANTS (machine-enforced by tests/test_epic_4_1_helm_chart_skeleton.py):
#   - NO secret values inline (use env block secretKeyRef only)
#   - NO runtime guard flag key strings anywhere in this chart (key absence enforced)
#   - replicaCount minimum 1 (HARD RULE TEST cluster scale-to-zero YASAK)
#   - Chart is render-only; no live cluster commands embedded in templates/docs
#
# Operator MUST review docs/MULTI-TENANT-DEPLOYMENT.md (delivered in E-4-2a/E-4-2b)
# BEFORE production deployment. This template is beta; production claim deferred.

# Number of pod replicas. MINIMUM 1 (scale-to-zero forbidden per HARD RULE).
replicaCount: 1

# Container image configuration.
image:
  repository: ghcr.io/halildeu/ao-kernel
  # Operator should pin a digest in production; tag default is for skeleton testing.
  tag: "4.3.1"
  pullPolicy: IfNotPresent

# Optional image pull secrets (operator-managed Kubernetes Secrets).
imagePullSecrets: []

# Override chart name in resource labels (typical Helm pattern).
nameOverride: ""
fullnameOverride: ""

# Service configuration (ClusterIP for in-cluster reachability).
service:
  type: ClusterIP
  port: 8080
  # Health/readiness ports (kept distinct for clarity; default = same as port).
  healthzPort: 8080
  readyzPort: 8080

# Resource requests/limits (operator MUST tune to workload; defaults are skeleton baseline).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Pod security context (least-privilege baseline; PSS-aligned).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ConfigMap-backed non-secret configuration.
config:
  # ao-kernel workspace root (mounted volume path inside the pod).
  workspaceRoot: "/var/lib/ao-kernel"
  # Optional log level (operator override).
  logLevel: "INFO"

# PostgreSQL backend (V5 Epic 4 E-4-3) — OPERATOR-OWNED, EXTERNAL.
#
# The chart does NOT deploy PostgreSQL and does NOT create its Secret. The
# operator provisions the database out-of-band (managed service, in-cluster
# operator, or StatefulSet) and a Kubernetes Secret with the application
# role credentials. The chart only references them via secretKeyRef.
# Full runbook: docs/OPERATOR-SECRET-MANAGEMENT.md
#
# Connection coordinates (host/port/dbname/sslmode) are non-secret plain env.
# Username/password are resolved via secretKeyRef ONLY — never inline here.
postgresql:
  # Disabled by default: ao-kernel runs in library/in-memory mode without a DB.
  # Operator sets enabled:true + provides connection coordinates + secret refs.
  enabled: false
  # Non-secret connection coordinates (operator overrides):
  host: ""
  port: 5432
  dbname: "ao_kernel"
  # require | verify-full recommended for production (verify-full needs CA mount).
  sslmode: "require"
  # Secret reference for the application role (chart does NOT create this Secret).
  secretName: ""
  usernameKey: "username"
  passwordKey: "password"

# Environment variables.
#
# Secrets MUST be referenced via secretKeyRef ONLY (NEVER inline values).
# Operator pre-provisions Kubernetes Secret out-of-band; the chart does not create secrets.
# See docs/OPERATOR-SECRET-MANAGEMENT.md for the PostgreSQL + secret pattern (E-4-3).
env:
  # Plain env vars (non-secret) — operator may add freely; example:
  plain: []
  # Secret env vars (resolved via secretKeyRef; chart does NOT define the secret).
  # Operator pre-creates the Kubernetes Secret; the chart only references it.
  secretRefs: []
  # Example entry (commented; operator pattern reference):
  #   - name: OPENAI_API_KEY
  #     secretName: ao-kernel-llm-secrets
  #     secretKey: openai_api_key

# Monitoring / observability (V5 Epic 4 E-4-4) — OPT-IN.
#
# ServiceMonitor (Prometheus Operator CRD) is rendered only when enabled AND
# the cluster has monitoring.coreos.com CRDs. The chart does NOT install
# Prometheus Operator. Alert routing is Microsoft Teams primary (operator
# wires Alertmanager → Teams; chart only declares the scrape target).
# Optional OTEL collector sidecar exports traces to an operator-owned endpoint.
monitoring:
  serviceMonitor:
    # Disabled by default (requires Prometheus Operator CRDs in-cluster).
    enabled: false
    path: "/metrics"
    interval: "30s"
    scrapeTimeout: "10s"
    additionalLabels: {}
  otelSidecar:
    # Optional OTEL Collector sidecar SKELETON (disabled by default; Codex
    # review absorb). When enabled the chart adds the container slot with a
    # hardened securityContext + pinned image + OTLP endpoint env ONLY. The
    # operator MUST supply the collector config (mounted ConfigMap + --config)
    # AND wire the main container's OTLP exporter to localhost:4317. No secret.
    enabled: false
    image: "otel/opentelemetry-collector-contrib:0.96.0"
    # OTLP endpoint the sidecar forwards to (operator-owned backend).
    otlpEndpoint: ""

# NetworkPolicy + PodSecurityStandards (V5 Epic 4 E-4-5) — OPT-IN baseline.
#
# networkPolicy: default-deny ingress + scoped egress (DNS + operator CIDRs).
# Operator MUST widen egress for the LLM provider endpoints actually used.
# podSecurityStandards: the chart's containerSecurityContext already meets the
# 'restricted' PSS profile; the operator applies the namespace ENFORCE label
# out-of-band (chart does not manage the namespace). See README / NOTES.
networkPolicy:
  enabled: false
  ingress:
    allowSameNamespace: true
    extraFrom: []
  egress:
    # DNS namespace the egress rule scopes port-53 to (well-known label
    # kubernetes.io/metadata.name). Default kube-system; operators whose DNS
    # lives elsewhere override. NOT a bare allow-all (Codex E-4-5 review).
    dnsNamespace: "kube-system"
    # Operator-allowed egress CIDRs (LLM providers etc). Empty = DNS-only.
    allowCidrs: []
podSecurityStandards:
  # The chart's pod/container securityContext satisfies 'restricted'. The
  # operator labels the namespace: pod-security.kubernetes.io/enforce=restricted
  # (chart does NOT manage the namespace; see docs/MULTI-TENANT-DEPLOYMENT.md).
  enforceProfile: "restricted"

# ServiceAccount (namespace-scoped; ClusterRole forbidden).
serviceAccount:
  create: true
  name: ""
  annotations: {}

# RBAC scope (namespace-scoped Role + RoleBinding; ClusterRole forbidden by Epic 4 boundary).
rbac:
  create: true
  # Operator may add custom rules; default empty (least privilege).
  rules: []

# Liveness/readiness probes (skeleton defaults; operator tunes per workload).
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Node selection / tolerations / affinity (operator-configurable; default empty).
nodeSelector: {}
tolerations: []
affinity: {}

# Pod labels / annotations (additive; operator-extensible).
podLabels: {}
podAnnotations: {}
